name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and its output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sinkctl version
      description: Output of `sinkctl version -o yaml`
    validations:
      required: true
  - type: input
    id: bugsink
    attributes:
      label: Bugsink version
