name: Feature request
description: Suggest a command, flag or MCP tool
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed command or tool
      placeholder: sinkctl issues list --project 1 --unresolved
